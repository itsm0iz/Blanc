name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ "${{ github.ref }}" = "refs/heads/feature/blanc-spaces" ]; then
            cp app/build/outputs/apk/debug/*.apk dist/blanc-spaces.apk
          else
            cp app/build/outputs/apk/debug/*.apk dist/blanc-debug.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blanc-debug-apk
          path: dist/*.apk
          if-no-files-found: warn

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/blanc-debug.apk \
            --title "Latest debug build" \
            --notes "Auto-built debug APK from commit ${{ github.sha }}. For testing/sideloading only — not a Play Store release." \
            --prerelease \
            --target "${{ github.sha }}"

      - name: Publish rolling Spaces test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/blanc-spaces'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete spaces-latest --yes --cleanup-tag || true
          gh release create spaces-latest dist/blanc-spaces.apk \
            --title "Blanc Spaces test build" \
            --notes "Swipe-left Spaces build from commit ${{ github.sha }}. Signed to update the existing Blanc debug install in place." \
            --prerelease \
            --target "${{ github.sha }}"
